# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 2 GB se quedaban cortos para Kotlin + KSP (Hilt y Room generan bastante codigo) y el
# compilador acababa pasando mas tiempo en el recolector de basura que compilando.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Tareas independientes en paralelo (por ejemplo compilar y procesar recursos).
org.gradle.parallel=true
# Cache de tareas: una tarea cuyas entradas no cambiaron no se vuelve a ejecutar, y el
# resultado se reutiliza incluso despues de un clean o al cambiar de rama. Es lo que mas
# recorta los builds repetidos, que son casi todos.
org.gradle.caching=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP registra sus carpetas generadas (build/generated/ksp/...) a través del DSL
# kotlin.sourceSets, que el Kotlin integrado de AGP 9 rechaza por defecto. Esta bandera es
# la vía de escape que documenta el propio AGP:
#   https://developer.android.com/r/tools/built-in-kotlin
# Se puede quitar cuando KSP pase a registrar sus fuentes con android.sourceSets.
android.disallowKotlinSourceSets=false
