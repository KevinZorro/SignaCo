name: CI

# Una sola verificación por cambio.
#
# Antes corría tres veces por el mismo código: una por el pull request de la rama, otra por el
# pull request de vuelta desde master, y otra por el push a master al mergear. GitHub ya prueba
# el RESULTADO de la mezcla en el evento pull_request, así que volver a correr todo en el push a
# master es repetir el mismo trabajo con el mismo árbol.
#
# Queda así:
#   - pull_request      -> compila, prueba y analiza. Es la verificación que bloquea el merge.
#   - push a master     -> lo mismo, para no dejar sin red un push directo, más el emulador.
#   - workflow_dispatch -> a mano, desde la pestaña Actions.
#
# Para sincronizar la rama con master NO abras un pull request de master hacia la rama: eso
# dispara una verificación extra. Usa el botón "Update branch" del propio pull request, o en
# local `git merge master`.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar el JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Las tres tareas en UNA invocación. Separadas, Gradle arrancaba y configuraba el proyecto
      # tres veces seguidas para el mismo árbol. Juntas comparten configuración y caché de tareas.
      - name: Compilar, probar y analizar
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-verificacion
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  pruebas-instrumentadas:
    name: Pruebas de base de datos en emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # El emulador es lo más lento del pipeline y lo que comprueba casi no cambia: que Room
    # ejecute sus consultas y precargue el catálogo contra un SQLite de verdad. En cada push a
    # una rama no aporta; en master sí, antes de dar por buena la integración.
    if: github.event_name != 'pull_request'

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar el JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      # El emulador necesita virtualizacion por hardware para no tardar una eternidad.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # El emulador falló al arrancar dos veces seguidas sin llegar a ejecutar ninguna prueba.
      # Dejar constancia del disco libre: quedarse sin espacio es una causa clásica y, si vuelve
      # a pasar, este dato dice si va por ahí o no.
      - name: Espacio en disco antes del emulador
        run: df -h /

      - name: Correr las pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Imagen "default" en vez de "google_apis": las pruebas son de Room y SQLite y no usan
          # nada de los servicios de Google. La imagen es más pequeña de descargar y más liviana
          # de arrancar, que es justo donde está fallando.
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-instrumentadas
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
